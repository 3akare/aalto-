<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aalto</title>
    <style>
      /* Warm near-black surfaces, cream ink, coral used sparingly.
         Palette derived from DESIGN.md's dark tokens.

         Nothing here is bold or semibold. Hierarchy comes from size, colour and
         space - which is also what lets the serif read as editorial rather than
         as a heading in a dashboard. */
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("fonts/CormorantGaramond-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: block;
      }

      :root {
        --coral: #cc785c;
        --coral-dim: rgba(204, 120, 92, 0.16);

        --bg: #1a1917;
        --stage: #242320;
        --card: #1f1e1b;
        --raised: #2b2926;

        --ink: #faf9f5;
        --ink-soft: #a09d96;
        --ink-faint: #6c6a64;

        --line: rgba(250, 249, 245, 0.07);
        --line-strong: rgba(250, 249, 245, 0.12);

        --ok: #5db872;
        --bad: #d98b7f;
        --ask: #e8a55a;

        --serif: "Cormorant Garamond", Garamond, "Times New Roman", serif;
        --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

        --ease: cubic-bezier(0.32, 0.72, 0, 1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        /* Same colour as the body so the popup frame never shows a white edge,
           whether or not the platform honours the radius below. */
        background: #1a1917;
      }

      body {
        width: 380px;
        margin: 0;
        padding: 16px 16px 18px;
        border-radius: 10px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 13.5px;
        font-weight: 400;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* --- header ------------------------------------------------------- */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-left: 2px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--coral);
      }
      .mark {
        flex: none;
      }
      .wordmark {
        color: var(--ink);
        font-family: var(--serif);
        font-size: 21px;
        font-weight: 400;
        letter-spacing: -0.2px;
        line-height: 1;
      }
      .ghost-btn {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        padding: 0;
        background: transparent;
        border: 0;
        border-radius: 9999px;
        color: var(--ink-faint);
        cursor: pointer;
        transition:
          color 0.18s var(--ease),
          background 0.18s var(--ease);
      }
      .ghost-btn:hover {
        color: var(--ink);
        background: var(--line);
      }
      .ghost-btn:focus-visible {
        outline: 2px solid var(--coral);
        outline-offset: 2px;
      }
      .ghost-btn[aria-expanded="true"] {
        color: var(--ink);
        background: var(--line);
      }

      /* --- stage -------------------------------------------------------- */
      .stage {
        position: relative;
        height: 150px;
        border-radius: 8px;
        background: var(--stage);
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .stage-label {
        position: absolute;
        top: 15px;
        left: 17px;
        font-size: 10.5px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: var(--ink-faint);
        transition: color 0.2s var(--ease);
      }
      .stage-label.live {
        color: var(--coral);
      }
      .lang-chip {
        position: absolute;
        top: 13px;
        right: 13px;
        font-size: 10.5px;
        letter-spacing: 0.3px;
        color: var(--ink-faint);
        border: 1px solid var(--line-strong);
        border-radius: 4px;
        padding: 1px 6px;
      }

      /* The resting state when opened by hand: press to start. */
      .record {
        width: 62px;
        height: 62px;
        padding: 0;
        border-radius: 9999px;
        border: 1px solid var(--line-strong);
        background: var(--raised);
        color: var(--ink);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          transform 0.22s var(--ease),
          background 0.22s var(--ease),
          border-color 0.22s var(--ease),
          box-shadow 0.22s var(--ease);
      }
      .record:hover {
        background: var(--coral);
        border-color: var(--coral);
        transform: scale(1.05);
        box-shadow: 0 0 0 8px var(--coral-dim);
      }
      .record:focus-visible {
        outline: 2px solid var(--coral);
        outline-offset: 4px;
      }
      .record:active {
        transform: scale(0.97);
      }

      .record-hint {
        position: absolute;
        bottom: 15px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11.5px;
        color: var(--ink-faint);
      }
      kbd {
        font-family: var(--sans);
        font-size: 10.5px;
        color: var(--ink-soft);
        border: 1px solid var(--line-strong);
        border-radius: 4px;
        padding: 1.5px 6px;
      }

      #wave {
        display: block;
        width: 296px;
        height: 62px;
      }

      .loading {
        color: var(--coral);
        animation: spin 0.9s linear infinite;
        transform-origin: center;
        line-height: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .answer-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .answer-row .answer {
        flex: 1;
      }
      #speakBtn {
        flex: none;
        margin-top: 2px;
      }
      #speakBtn.playing {
        color: var(--coral);
      }

      /* Must outrank #wave { display: block } - an ID selector, which no amount
         of attribute-selector stacking can beat. !important is the right tool
         here and the lint rule is wrong about this one. */
      /* biome-ignore lint/complexity/noImportantStyles: must beat an ID selector */
      [hidden] {
        display: none !important;
      }

      /* --- reply -------------------------------------------------------- */
      .reply {
        margin-top: 14px;
        padding: 17px 18px;
        border-radius: 8px;
        background: var(--card);
        border: 1px solid var(--line);
        animation: rise 0.26s var(--ease);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
      }
      .heard {
        font-size: 12px;
        color: var(--ink-faint);
        margin-bottom: 9px;
      }
      .answer {
        font-family: var(--serif);
        font-size: 21px;
        font-weight: 400;
        line-height: 1.34;
        letter-spacing: -0.15px;
        color: var(--ink);
      }
      .answer.is-error {
        font-family: var(--sans);
        font-size: 13.5px;
        color: var(--bad);
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .has-answer ul {
        margin-top: 13px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      li {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        padding: 5px 0;
        font-size: 12.5px;
        color: var(--ink-soft);
      }
      li svg {
        flex: none;
        margin-top: 1px;
      }
      li.ok svg {
        color: var(--ok);
      }
      li.failed svg {
        color: var(--bad);
      }
      li.needs_input svg {
        color: var(--ask);
      }
      li.pending {
        color: var(--ink-faint);
      }
      li.pending svg {
        color: var(--ink-faint);
        animation: spin 1.1s linear infinite;
        transform-origin: center;
      }

      @media (prefers-reduced-motion: reduce) {
        .loading,
        li.pending svg {
          animation-duration: 2.6s;
        }
        .record,
        .ghost-btn,
        .reply {
          transition: none;
          animation: none;
        }
      }

      /* --- settings ----------------------------------------------------- */
      .settings {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      label {
        display: block;
        margin-bottom: 11px;
        font-size: 11px;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      input,
      select {
        width: 100%;
        margin-top: 5px;
        padding: 9px 11px;
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
        color: var(--ink);
        background: var(--stage);
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        transition:
          border-color 0.18s var(--ease),
          box-shadow 0.18s var(--ease);
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--coral);
        box-shadow: 0 0 0 3px var(--coral-dim);
      }
      .link-row {
        margin: 0;
        font-size: 11.5px;
      }
      .link-btn {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
        color: var(--coral);
        cursor: pointer;
      }
      .link-btn:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand"><svg class="mark" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.44 4.80 1.97 5.31 2.50 5.78 3.02 6.17 3.55 6.46 4.08 6.63 4.61 6.67 5.14 6.60 5.66 6.43 6.19 6.19 6.72 5.91 7.25 5.63 7.78 5.37 8.30 5.15 8.83 4.99 9.36 4.89 9.89 4.83 10.42 4.81 10.94 4.79 11.47 4.76 12.00 4.69 12.53 4.58 13.06 4.40 13.58 4.18 14.11 3.91 14.64 3.62 15.17 3.35 15.70 3.13 16.22 2.98 16.75 2.93 17.28 3.00 17.81 3.19 18.34 3.51 18.86 3.92 19.39 4.40 19.92 4.91 20.45 5.42 20.98 5.87 21.50 6.24 22.03 6.51 22.56 6.65" /><polyline points="1.44 13.53 1.97 13.13 2.50 12.72 3.02 12.35 3.55 12.04 4.08 11.80 4.61 11.65 5.14 11.56 5.66 11.53 6.19 11.52 6.72 11.52 7.25 11.49 7.78 11.41 8.30 11.29 8.83 11.10 9.36 10.88 9.89 10.64 10.42 10.41 10.94 10.23 11.47 10.13 12.00 10.14 12.53 10.28 13.06 10.54 13.58 10.93 14.11 11.43 14.64 11.98 15.17 12.57 15.70 13.13 16.22 13.62 16.75 14.00 17.28 14.25 17.81 14.35 18.34 14.30 18.86 14.11 19.39 13.81 19.92 13.44 20.45 13.04 20.98 12.64 21.50 12.28 22.03 11.98 22.56 11.76" /><polyline points="1.44 18.42 1.97 18.46 2.50 18.49 3.02 18.49 3.55 18.45 4.08 18.37 4.61 18.25 5.14 18.11 5.66 17.99 6.19 17.89 6.72 17.86 7.25 17.91 7.78 18.06 8.30 18.32 8.83 18.67 9.36 19.09 9.89 19.56 10.42 20.04 10.94 20.49 11.47 20.87 12.00 21.15 12.53 21.31 13.06 21.33 13.58 21.22 14.11 20.99 14.64 20.66 15.17 20.28 15.70 19.86 16.22 19.46 16.75 19.10 17.28 18.81 17.81 18.59 18.34 18.46 18.86 18.40 19.39 18.40 19.92 18.43 20.45 18.47 20.98 18.49 21.50 18.49 22.03 18.44 22.56 18.34" /></svg><span class="wordmark">Aalto</span></span>
      <button
        type="button"
        class="ghost-btn"
        id="settingsBtn"
        aria-expanded="false"
        aria-label="Settings"
      ></button>
    </header>

    <div class="stage">
      <span class="stage-label" id="stageLabel"></span>
      <span class="lang-chip" id="langChip"></span>

      <button type="button" class="record" id="recordBtn" aria-label="Start listening"></button>
      <canvas id="wave" width="592" height="124" hidden></canvas>
      <span id="loader" class="loading" hidden></span>

      <div class="record-hint" id="recordHint">
        or press <kbd id="shortcutHint">Alt+A</kbd>
      </div>

    </div>

    <section class="reply" id="reply" hidden>
      <div class="heard" id="heard" hidden></div>
      <div class="answer-row" id="answerRow" hidden>
        <div class="answer" id="answer"></div>
        <button type="button" class="ghost-btn" id="speakBtn" aria-label="Read this aloud"></button>
      </div>
      <ul id="tasks"></ul>
    </section>

    <section class="settings" id="settings" hidden>
      <label>
        Server
        <input type="text" id="serverUrl" value="http://localhost:8787" />
      </label>
      <label>
        Request key
        <input type="password" id="apiKey" placeholder="optional" />
      </label>
      <label>
        Language
        <select id="langSelect">
          <option value="pcm">Pidgin ⇄ English</option>
          <option value="yo">Yoruba ⇄ English</option>
          <option value="ha">Hausa ⇄ English</option>
          <option value="ig">Igbo ⇄ English</option>
          <option value="sw">Swahili ⇄ English</option>
          <option value="am">Amharic ⇄ English</option>
          <option value="zu">Zulu ⇄ English</option>
          <option value="rw">Kinyarwanda ⇄ English ⇄ French</option>
          <option value="en">English only</option>
        </select>
      </label>
      <p class="link-row">
        <button type="button" class="link-btn" id="shortcutLink">Change shortcut</button>
      </p>
    </section>

    <script src="icons.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
